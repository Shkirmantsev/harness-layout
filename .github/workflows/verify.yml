name: verify

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  full-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @fission-ai/openspec@1.12.0
      - run: python -m venv tmp/local/project-context/venv
      - run: tmp/local/project-context/venv/bin/python -m pip install -e tools/mcp/project-context-mcp
      - run: cp .env.example .env
      - run: python scripts/bootstrap_env.py
      - run: docker compose --env-file .env -f infra/compose.yaml --profile '*' config -q
      - run: python harness.py check-delegated
